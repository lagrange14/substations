- type: entity
  parent: BaseItem
  id: ResearchDisk
  name: research point disk (1000)
  description: A disk for the R&D server containing 1000 points.
  components:
  - type: Sprite
    sprite: Objects/Specific/Research/researchdisk.rsi
    state: icon
  - type: ResearchDisk
  - type: GuideHelp
    guides:
    - Science
  - type: StaticPrice # L5 Half a dollar per research point?
    price: 500

- type: entity
  parent: ResearchDisk
  id: ResearchDisk5000
  name: research point disk (5000)
  description: A disk for the R&D server containing 5000 points.
  components:
  - type: ResearchDisk
    points: 5000
  - type: StaticPrice # L5 with a slight bonus for the larger disk
    price: 2750

- type: entity
  parent: ResearchDisk
  id: ResearchDisk10000
  name: research point disk (10000)
  description: A disk for the R&D server containing 10000 points.
  components:
  - type: ResearchDisk
    points: 10000
  - type: StaticPrice # L5 bigger bonus for the largest disk, more valuable data on it?
    price: 7250

- type: entity
  parent: ResearchDisk
  id: ResearchDiskDebug
  name: research point disk
  suffix: DEBUG, DO NOT MAP
  categories: [ DoNotMap ]
  description: A disk for the R&D server containing all the points you could ever need.
  components:
  - type: ResearchDisk
    unlockAllTech: true

- type: entity
  parent: BaseItem
  id: TechnologyDisk
  name: technology disk
  description: A disk for the R&D server containing research technology.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      map: ["enum.DamageStateVisualLayers.Base"]
    - state: datadisk_label
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        datadisk_base: Sixteen
  - type: TechnologyDisk
  - type: StaticPrice
    price: 750 # L5 these cost 1000 points, but they can be pretty useless
  - type: StealTarget
    stealGroup: TechnologyDisk

- type: entity
  parent: TechnologyDisk
  id: TechnologyDiskRare
  suffix: rare.
  components:
  - type: TechnologyDisk
    tierWeightPrototype: RareTechDiskTierWeights
  - type: StaticPrice # L5 idk how this prototype works, but 2500 for the blueprints to some valuable tech? Sure
    price: 2500
