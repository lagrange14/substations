# Curd cheese, substitute for a lot of things
- type: entity
  name: curd cheese
  parent: FoodBakingBase
  id: FoodCurdCheese
  description: Known by many names throughout cuisine, curd cheese is useful for a wide variety of dishes.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - creamy
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/cheese.rsi
    state: curdcheese
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20 # L5 the old version sucked you lost So much nutrition
        reagents:
        - ReagentId: Protein
          Quantity: 12
        - ReagentId: Cream
          Quantity: 4
  - type: Tag
    tags:
      - ClothMade # Mothic Food
      - Dairy # L5

- type: entity
  name: cheese curds
  parent: FoodBakingBase
  id: FoodCheeseCurds
  description: Not to be mistaken for curd cheese. Tasty deep fried.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/cheese.rsi
    state: cheesecurds
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 3
        reagents:
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: Cream
          Quantity: 1
  - type: Tag
    tags:
      - ClothMade # Mothic Food
      - Dairy # L5

# Mozzarella
- type: entity
  name: mozzarella cheese
  parent: FoodBakingBase
  id: FoodMozzarella
  description: Delicious, creamy, and cheesy, all in one simple package.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/cheese.rsi
    state: mozzarella
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25 # L5 i'm trying to make these better but not excessive
        reagents:
        - ReagentId: Protein
          Quantity: 13
        - ReagentId: Cream
          Quantity: 8
  - type: Tag
    tags:
      - ClothMade # Mothic Food

- type: entity
  name: herby cheese
  parent: FoodBakingBase
  id: FoodMothHerbyCheese
  description: As a staple of mothic cuisine, cheese is often augmented with various flavours to keep variety in their diet.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - leafy
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/ingredients.rsi
    state: herbycheese
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25 # L5 adjusted to match the curd cheese
        reagents:
        - ReagentId: Nutriment
          Quantity: 7
        - ReagentId: Protein
          Quantity: 12
        - ReagentId: Cream
          Quantity: 4
  - type: Tag
    tags:
      - ClothMade # Mothic Food
      - Dairy
