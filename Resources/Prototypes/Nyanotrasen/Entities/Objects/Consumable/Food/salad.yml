#Salads

- type: entity
  name: caprese salad
  parent: FoodBakingBase
  id: FoodMothCapreseSalad
  description: A very tasty yet simple to prepare salad.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - tomato
      - leafy
  - type: Sprite
    sprite: Nyanotrasen/Objects/Consumable/Food/salad.rsi
    state: capresesalad
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 32 # L5
        reagents:
        - ReagentId: Nutriment
          Quantity: 12
        - ReagentId: Protein
          Quantity: 10
        - ReagentId: Vitamin
          Quantity: 6
  - type: Tag
    tags:
    - Fruit
    - Dairy # L5
#Tastes like mozzarella, tomato and balsamic

