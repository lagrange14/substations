- type: entity
  name: scrambled eggs
  parent: FoodBowlBase
  id: FoodMealScrambledEggs
  description: Some cooked eggs with salt. Yummy!
  components:
  - type: FlavorProfile
    flavors:
    - egg
    - salty
  - type: Sprite
    sprite: _DV/Objects/Consumable/Food/scrambledeggs.rsi
    layers:
    - state: bowl
    - state: scrambled-eggs
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 28 # L5 Bumping some food values to better match their recipes
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: EggCooked
          Quantity: 12
        - ReagentId: TableSalt
          Quantity: 5
  - type: FoodSequenceElement
    entries:
      Burger: ScrambledEggs
      Taco: ScrambledEggs
# Tastes like eggs, butter and salt

- type: foodSequenceElement
  id: ScrambledEggs
  name: food-sequence-content-scrambled-eggs
  sprites:
  - sprite: _DV/Objects/Consumable/Food/scrambledeggs.rsi
    state: scrambled-eggs

- type: entity
  name: blue tomato soup
  parent: FoodBowlBase
  id: FoodSoupTomatoBlue
  description: It's hard to avoid spilling this tomato soup...
  components:
  - type: FlavorProfile
    flavors:
      - funny
      - tomato
  - type: Sprite
    sprite: _DV/Objects/Consumable/Food/bluepurpletomatosoup.rsi
    layers:
    - state: bowl
    - state: blue-tomato
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 58 # L5 ok seriously blue tomatoes are 24u, 15u of lube where was all the lube going before
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: SpaceLube
          Quantity: 28
        - ReagentId: Vitamin
          Quantity: 8
        - ReagentId: Water
          Quantity: 8
  - type: Tag
    tags:
    - Fruit
    - Soup
    - Vegan # L5 should have this tag, shouldn't it?

