- type: constructionGraph
  id: GasUnaryFlowmos
  start: start
  graph:
  - node: start
    edges:
    - to: ventpumpin
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

    - to: ventpumpout
      steps:
      - material: Steel
        amount: 2
        doAfter: 1

  - node: ventpumpin
    entity: GasVentPumpInlet
    edges:
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity
      steps:
      - tool: Screwing
        doAfter: 1
      - tool: Welding
        doAfter: 1

  - node: ventpumpout
    entity: GasVentPumpOutlet
    edges:
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity
      steps:
      - tool: Screwing
        doAfter: 1
      - tool: Welding
        doAfter: 1
