- type: constructionGraph
  id: Sink
  start: start
  graph:
  - node: start
    edges:
    - to: sink
      steps:
      - material: Steel
        amount: 10
      - tag: Pipe
        name: crafting-pipe-any
        icon:
          sprite: Structures/Piping/Atmospherics/pipe.rsi
          state: pipeBend
      - tag: Tank
        name: crafting-sink-water-tank
        icon:
          sprite: Structures/Storage/tanks.rsi
          state: watertank-2
        doAfter: 15
    - to: sinkWide
      steps:
      - material: Steel
        amount: 20
      - tag: Pipe
        name: crafting-pipe-any
        icon:
          sprite: Structures/Piping/Atmospherics/pipe.rsi
          state: pipeBend
      - tag: TankBig
        name: crafting-sink-big-water-tank
        icon:
          sprite: Structures/Storage/tanks.rsi
          state: highwatertank-2
        doAfter: 10
  - node: sink
    entity: Sink
  - node: sinkWide
    entity: SinkWide

