- type: entity
  id: ActionToggleSecHud
  name: Toggle Sec Hud
  description: Toggles your security HUD.
  components:
    - type: InstantAction
      useDelay: 2
      icon: Interface/Actions.scream.png
      event: !type:ToggleSecHudEvent
      checkCanInteract: false

- type: trait
  category: Skills
  id: SecurityHUD
  name: trait-hud-security-name
  description: trait-hud-security-desc
  components:
  - type: ToggleSecHud
    toggleSecHudAction: ActionToggleSecHud

