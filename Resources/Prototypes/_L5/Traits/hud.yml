- type: trait
  category: Skills
  id: SecurityHUD
  name: trait-hud-security-name
  description: trait-hud-security-desc
  components:
  - type: ToggleSecHud
    toggleAction: ActionToggleSecHud
    toggleOnSound: /Audio/_L5/Effects/HUD/SecHudEnable.ogg
    toggleOffSound: /Audio/_L5/Effects/HUD/SecHudDisable.ogg

- type: entity
  id: ActionToggleSecHud
  name: Toggle Sec Hud
  description: Toggles your security HUD.
  components:
    - type: InstantAction
      useDelay: 2
      icon: _L5/Interface/Actions/sechud.png
      event: !type:ToggleEvent
      checkCanInteract: false

