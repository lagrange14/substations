- type: entity
  abstract: true
  parent: BaseAction
  id: BaseActionToggleHud
  components:
  - type: Action
    useDelay: 2
    checkCanInteract: false
    raiseOnUser: true
  - type: InstantAction
    event: !type:ToggleEvent

- type: trait
  category: Skills
  id: SecurityHUD
  name: trait-hud-security-name
  description: trait-hud-security-desc
  components:
  - type: SecHudTrait
    actions: [ActionToggleSecHud]

- type: entity
  parent: BaseActionToggleHud
  id: ActionToggleSecHud
  name: Toggle Sec Hud
  description: Toggles your security HUD.
  components:
  - type: Action
    icon: _L5/Interface/Actions/sechud.png
    sound: /Audio/_L5/Effects/HUD/SecHudEnable.ogg
    soundOff: /Audio/_L5/Effects/HUD/SecHudDisable.ogg
  - type: InstantAction
    event: !type:RelayedActionComponentChangeEvent
      components:
      - type: ShowJobIcons
      - type: ShowMindShieldIcons
      - type: ShowCriminalRecordIcons

- type: trait
  category: Skills
  id: MedicalHUD
  name: trait-hud-medical-name
  description: trait-hud-medical-desc
  components:
  - type: MedHudTrait
    actions: [ActionToggleMedHud]

- type: entity
  parent: BaseActionToggleHud
  id: ActionToggleMedHud
  name: Toggle Med Hud
  description: Toggles your medical HUD.
  components:
  - type: Action
    icon: _L5/Interface/Actions/medhud.png
    sound: /Audio/_L5/Effects/HUD/MedHudEnable.ogg
    soundOff: /Audio/_L5/Effects/HUD/MedHudDisable.ogg
  - type: InstantAction
    event: !type:RelayedActionComponentChangeEvent
      components:
      - type: ShowHealthBars
      - type: ShowHealthIcons

- type: trait
  category: Skills
  id: BeerHUD
  name: trait-hud-beer-name
  description: trait-hud-beer-desc
  components:
  - type: BeerHudTrait
    actions: [ActionToggleBeerHud]

- type: entity
  parent: BaseActionToggleHud
  id: ActionToggleBeerHud
  name: Toggle Beer Hud
  description: Toggles your beer HUD.
  components:
  - type: Action
    icon: _L5/Interface/Actions/beerhud.png
    sound: /Audio/_L5/Effects/HUD/BeerHudEnable.ogg
    soundOff: /Audio/_L5/Effects/HUD/BeerHudDisable.ogg
  - type: InstantAction
    event: !type:RelayedActionComponentChangeEvent
      components:
      - type: ShowThirstIcons
      - type: SolutionScanner

- type: trait
  category: Skills
  id: DiagnosticHUD
  name: trait-hud-diagnostic-name
  description: trait-hud-diagnostic-desc
  components:
  - type: DiagnosticHudTrait
    actions: [ActionToggleDiagnosticHud, ActionToggleHudDiagnosticAICamera]

- type: entity
  parent: BaseActionToggleHud
  id: ActionToggleDiagnosticHud
  name: Toggle Diagnostic Hud
  description: Toggles your diagnostic HUD.
  components:
  - type: Action
    sound:
      path: /Audio/_L5/Effects/HUD/DiagnosticHudEnable.ogg
      params: { volume: -8 }
    soundOff:
      path: /Audio/_L5/Effects/HUD/DiagnosticHudDisable.ogg
      params: { volume: -8 }
    icon:
      sprite: Clothing/Eyes/Hud/diag.rsi
      state: icon
  - type: InstantAction
    event: !type:RelayedActionComponentChangeEvent
      components:
      - type: ShowHealthBars
        damageContainers:
        - Inorganic
        - Silicon
        - HumanoidSilicon

- type: entity
  parent: BaseActionToggleHud
  id: ActionToggleHudDiagnosticAICamera # Basically dupe of ActionToggleHudDiagnosticCamera but with event
  name: Toggle SSR Overlay
  description: View an overlay of what the SSR is able to see around you.
  components:
  - type: Action
    sound:
      path: /Audio/_L5/Effects/HUD/AiHudEnable.ogg
      params: { volume: -8 }
    soundOff:
      path: /Audio/_L5/Effects/HUD/AiHudDisable.ogg
      params: { volume: -8 }
    icon:
      sprite: Mobs/Silicon/station_ai.rsi
      state: ai_camera
  - type: InstantAction
    event: !type:RelayedActionComponentChangeEvent
      components:
      - type: StationAiOverlay
        cosmetic: true
